[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_ANON_KEY,SUPABASE_DATABASE_URL,VITE_SUPABASE_PUBLISHABLE_KEY"

[[edge_functions]]
  function = "og-news"
  path = "/news/*"

[[edge_functions]]
  function = "extract-og"
  path = "/api/extract-og"

[[edge_functions]]
  function = "proxy-image"
  path = "/api/proxy-image"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer-when-downgrade"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com https://www.google-analytics.com https://accounts.google.com; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://www.google-analytics.com https://analytics.google.com https://*.googletagmanager.com https://accounts.google.com https://apis.google.com https://oauth2.googleapis.com https://www.google.com https://fcm.googleapis.com https://*.googleapis.com; frame-src https://accounts.google.com https://www.youtube.com https://www.youtube-nocookie.com https://www.facebook.com https://web.facebook.com;"

# Assets: cache aggressively
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Admin routes: never cache
[[headers]]
  for = "/*/dashboard/*"
  [headers.values]
    Cache-Control = "private, no-store, no-cache, must-revalidate"

[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "private, no-store, no-cache, must-revalidate"

# API edge functions: never cache
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "private, no-store, no-cache, must-revalidate"
